<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام الفواتير الرسمي - BranZar</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        body { background-color: #F1F5F9; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        /* ═══ Form Styling (Modern & Clean) ═══ */
        .form-card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 24px; border: 1px solid #E2E8F0; }
        .form-title { font-size: 16px; font-weight: 800; color: #1E293B; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #E2E8F0; padding-bottom: 12px; }
        .form-label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 6px; }
        .form-input { width: 100%; padding: 12px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: 'Cairo'; transition: all 0.2s; background: #F8FAFC; color: #1E293B; }
        .form-input:focus { outline: none; border-color: #1E3A8A; background: white; box-shadow: 0 0 0 3px rgba(30,58,138,0.1); }
        
        /* ═══ Product List Form Styling ═══ */
        .product-item-group { background: #F8FAFC; border: 1px solid #E2E8F0; padding: 16px; border-radius: 8px; margin-bottom: 12px; position: relative; }
        .product-item-group .form-input { background: white; }
        
        /* ═══ A4 Paper Layout ═══ */
        .preview-container { width: 100%; overflow-x: auto; padding: 10px; display: flex; justify-content: center; }
        .invoice-paper { 
            width: 210mm; min-height: 297mm; background: white; position: relative; padding: 20mm;
            overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); transform-origin: top center;
            display: flex; flex-direction: column;
        }
        
        /* ═══ Watermark (Center) ═══ */
        .watermark { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 450px; height: 450px; opacity: 0.03; pointer-events: none; z-index: 0; mix-blend-mode: multiply; 
        }

        /* ═══ Formal Invoice Elements ═══ */
        .invoice-content { position: relative; z-index: 5; display: flex; flex-direction: column; height: 100%; }
        
        .info-section { display: flex; gap: 30px; margin-bottom: 30px; margin-top: 20px; }
        .info-box { flex: 1; border: 1px solid #E2E8F0; border-radius: 8px; padding: 16px; background: #FAFAFA; }
        .info-box h3 { font-size: 14px; font-weight: 800; color: #1E3A8A; margin: 0 0 12px 0; padding-bottom: 8px; border-bottom: 1px solid #E2E8F0; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #475569; }
        .info-row span:last-child { font-weight: 700; color: #0F172A; }

        .invoice-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        .invoice-table th { background: #1E3A8A; color: white; padding: 12px; font-weight: 700; font-size: 13px; border: 1px solid #1E3A8A; text-align: center; }
        .invoice-table td { padding: 10px; border: 1px solid #E2E8F0; text-align: center; font-weight: 600; font-size: 13px; color: #1E293B; height: 40px; }
        .invoice-table tbody tr:nth-child(even) { background-color: #F8FAFC; }

        .total-section { display: flex; justify-content: flex-end; margin-bottom: 30px; }
        .total-box { border: 1px solid #1E3A8A; border-radius: 8px; overflow: hidden; display: flex; min-width: 250px; }
        .total-label { background: #F8FAFC; color: #1E3A8A; padding: 12px 20px; font-weight: 800; font-size: 15px; border-left: 1px solid #1E3A8A; display: flex; align-items: center; }
        .total-value { background: #1E3A8A; color: white; padding: 12px 20px; font-weight: 900; font-size: 18px; display: flex; align-items: center; justify-content: center; flex: 1; direction: ltr; }

        /* ═══ Bottom Fixed Stamp ═══ */
        .stamp-section { 
            display: flex; 
            justify-content: flex-start; /* يضع الختم في اليسار */
            margin-top: auto; /* يدفعه دائماً إلى أسفل الصفحة */
            padding-top: 20px;
        }
        .bottom-stamp {
            width: 140px; /* حجم الختم */
            height: 140px;
            object-fit: contain;
            opacity: 0.85; /* شفافية خفيفة ليعطي واقعية */
            transform: rotate(-12deg); /* ميلان بسيط مثل الختم الحقيقي */
        }

        /* ═══ PDF Print Fixes ═══ */
        body.exporting .no-print { display: none !important; }
        body.exporting .preview-container { padding: 0 !important; overflow: visible !important; }
        body.exporting .invoice-paper { transform: scale(1) !important; box-shadow: none !important; margin: 0 !important; }
    </style>
</head>
<body class="pb-20 md:pb-0">

    <div class="max-w-7xl mx-auto p-4 md:p-6 flex flex-col lg:flex-row gap-6">
        
        <!-- ═══ LEFT SIDE: Input Form ═══ -->
        <div class="w-full lg:w-1/3 no-print flex flex-col gap-4">
            
            <!-- Store Info -->
            <div class="form-card">
                <div class="form-title"><span class="w-1.5 h-4 bg-orange-500 rounded-full"></span> بيانات المتجر والفاتورة</div>
                <div class="mb-4">
                    <label class="form-label">اسم المتجر</label>
                    <input type="text" id="in-store" class="form-input" placeholder="أدخل اسم متجرك" oninput="syncData()">
                </div>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="form-label">رقم الفاتورة</label>
                        <input type="text" id="in-invoice-num" class="form-input text-gray-500 cursor-not-allowed" readonly>
                    </div>
                    <div>
                        <label class="form-label">التاريخ</label>
                        <input type="date" id="in-date" class="form-input" oninput="syncData()">
                    </div>
                </div>
                <div>
                    <label class="form-label">العملة</label>
                    <select id="in-currency" class="form-input" onchange="syncData()">
                        <option value="ج.س">جنيه سوداني (ج.س)</option>
                        <option value="USD">دولار أمريكي (USD)</option>
                    </select>
                </div>
            </div>

            <!-- Customer Info -->
            <div class="form-card">
                <div class="form-title"><span class="w-1.5 h-4 bg-blue-800 rounded-full"></span> بيانات العميل</div>
                <div class="mb-4">
                    <label class="form-label">اسم العميل</label>
                    <input type="text" id="in-customer" class="form-input" placeholder="اسم العميل" oninput="syncData()">
                </div>
                <div>
                    <label class="form-label">رقم الواتساب</label>
                    <input type="tel" id="in-wa" class="form-input" placeholder="مثال: 249912345678" oninput="syncData()">
                </div>
            </div>

            <!-- Products -->
            <div class="form-card">
                <div class="flex justify-between items-center mb-4 border-b border-gray-200 pb-3">
                    <div class="form-title !mb-0 !border-0 !pb-0"><span class="w-1.5 h-4 bg-orange-500 rounded-full"></span> المنتجات</div>
                    <button onclick="addItemRow()" class="text-sm font-bold text-blue-800 hover:text-blue-600 flex items-center gap-1">
                        <span class="text-lg">+</span> إضافة
                    </button>
                </div>
                
                <div id="items-container" class="space-y-4">
                    <!-- Rows generated by JS -->
                </div>
            </div>

            <!-- Download Button -->
            <div class="sticky bottom-4 z-50">
                <button onclick="exportPDF()" id="btn-download" class="w-full py-4 bg-blue-900 text-white font-black text-lg rounded-xl shadow-lg shadow-blue-900/30 hover:bg-blue-800 transition flex items-center justify-center gap-3">
                    تحميل الفاتورة PDF
                </button>
            </div>
        </div>

        <!-- ═══ RIGHT SIDE: A4 Invoice Preview ═══ -->
        <div class="w-full lg:w-2/3 preview-container">
            <div class="invoice-paper" id="invoice-paper">
                
                <!-- Watermark Center -->
                <img src="https://i.ibb.co/fG8PmHV2/file-0000000072408210b10e441c56a8683e.png" class="watermark" alt="BranZar Watermark" crossorigin="anonymous">

                <div class="invoice-content">
                    
                    <!-- Header -->
                    <div class="flex justify-between items-center border-b-2 border-gray-800 pb-6 mb-2">
                        <div>
                            <img src="https://i.ibb.co/fG8PmHV2/file-0000000072408210b10e441c56a8683e.png" alt="Logo" class="h-24 object-contain" crossorigin="anonymous">
                        </div>
                        <div class="text-left">
                            <h1 class="text-3xl font-black text-gray-900 mb-1">فاتورة مبيعات</h1>
                            <p class="text-sm font-bold text-gray-500 tracking-widest uppercase">Sales Invoice</p>
                        </div>
                    </div>

                    <!-- Info Section -->
                    <div class="info-section">
                        <!-- Store Info -->
                        <div class="info-box">
                            <h3>معلومات المتجر</h3>
                            <div class="info-row"><span>اسم المتجر:</span><span id="disp-store">---</span></div>
                            <div class="info-row"><span>رقم الفاتورة:</span><span id="disp-num">---</span></div>
                            <div class="info-row"><span>التاريخ:</span><span id="disp-date">---</span></div>
                        </div>

                        <!-- Customer Info -->
                        <div class="info-box">
                            <h3>معلومات العميل</h3>
                            <div class="info-row"><span>اسم العميل:</span><span id="disp-customer">---</span></div>
                            <div class="info-row"><span>رقم الواتساب:</span><span id="disp-wa" dir="ltr">---</span></div>
                        </div>
                    </div>

                    <!-- Table -->
                    <table class="invoice-table">
                        <thead>
                            <tr>
                                <th style="width: 8%;">#</th>
                                <th style="width: 42%;">وصف المنتج / الخدمة</th>
                                <th style="width: 15%;">الكمية</th>
                                <th style="width: 15%;">السعر</th>
                                <th style="width: 20%;">الإجمالي</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Rendered by JS -->
                        </tbody>
                    </table>

                    <!-- Total -->
                    <div class="total-section">
                        <div class="total-box">
                            <div class="total-label">المجموع الإجمالي</div>
                            <div class="total-value">
                                <span id="disp-total">0.00</span>
                                <span id="disp-currency" class="mr-2 text-sm opacity-80">ج.س</span>
                            </div>
                        </div>
                    </div>

                    <!-- Bottom Fixed Stamp -->
                    <div class="stamp-section">
                        <!-- الختم الثابت -->
                        <img src="https://i.ibb.co/fG8PmHV2/file-0000000072408210b10e441c56a8683e.png" class="bottom-stamp" alt="ختم الفاتورة" crossorigin="anonymous">
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. توليد رقم الفاتورة
        function generateInvoiceNumber() {
            const now = new Date();
            const dateStr = now.toISOString().slice(0,10).replace(/-/g, ''); // YYYYMMDD
            const random = Math.floor(1000 + Math.random() * 9000);
            return `INV-${dateStr}-${random}`;
        }

        // 2. التهيئة
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('in-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('in-invoice-num').value = generateInvoiceNumber();

            // إضافة 3 صفوف افتراضية
            addItemRow();
            addItemRow();
            addItemRow();
            
            syncData();
        });

        // 3. إضافة صف منتج
        function addItemRow() {
            const container = document.getElementById('items-container');
            const rowId = 'row_' + Date.now() + Math.floor(Math.random() * 100);
            
            const div = document.createElement('div');
            div.className = 'product-item-group';
            div.id = rowId;
            div.innerHTML = `
                <button onclick="removeRow('${rowId}')" class="absolute top-2 left-2 text-red-400 hover:text-red-600 text-lg" title="حذف"><i class="fas fa-times"></i></button>
                <div class="mb-3 mt-1">
                    <label class="form-label text-xs">اسم المنتج</label>
                    <input type="text" class="form-input p-name" placeholder="وصف المنتج..." oninput="syncData()">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="form-label text-xs">الكمية</label>
                        <input type="number" class="form-input p-qty" value="1" min="1" oninput="syncData()">
                    </div>
                    <div>
                        <label class="form-label text-xs">سعر الوحدة</label>
                        <input type="number" class="form-input p-price" placeholder="0.00" min="0" oninput="syncData()">
                    </div>
                </div>
            `;
            container.appendChild(div);
            syncData();
        }

        function removeRow(rowId) {
            const row = document.getElementById(rowId);
            if (row) {
                row.remove();
                syncData();
            }
        }

        // 4. المزامنة والحسابات
        function syncData() {
            document.getElementById('disp-store').textContent = document.getElementById('in-store').value || '---';
            document.getElementById('disp-customer').textContent = document.getElementById('in-customer').value || '---';
            
            const invNum = document.getElementById('in-invoice-num').value;
            document.getElementById('disp-num').textContent = invNum || '---';
            
            const dateVal = document.getElementById('in-date').value;
            if (dateVal) {
                const [y, m, d] = dateVal.split('-');
                document.getElementById('disp-date').textContent = `${y}/${m}/${d}`;
            }
            
            document.getElementById('disp-wa').textContent = document.getElementById('in-wa').value || '---';
            document.getElementById('disp-currency').textContent = document.getElementById('in-currency').value;

            const rows = document.querySelectorAll('#items-container .product-item-group');
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';
            
            let grandTotal = 0;
            let validItemsCount = 0;

            rows.forEach((row, index) => {
                const name = row.querySelector('.p-name').value.trim();
                const qty = parseFloat(row.querySelector('.p-qty').value) || 0;
                const price = parseFloat(row.querySelector('.p-price').value) || 0;
                
                const rowTotal = qty * price;
                grandTotal += rowTotal;

                if (name || price > 0) {
                    validItemsCount++;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${validItemsCount}</td>
                        <td class="text-right px-4">${name || '---'}</td>
                        <td>${qty}</td>
                        <td>${price > 0 ? price.toLocaleString('en-US') : '0'}</td>
                        <td>${rowTotal > 0 ? rowTotal.toLocaleString('en-US', {minimumFractionDigits: 2}) : '0.00'}</td>
                    `;
                    tableBody.appendChild(tr);
                }
            });

            const minRows = 8;
            if (validItemsCount < minRows) {
                for (let i = validItemsCount; i < minRows; i++) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${i + 1}</td><td></td><td></td><td></td><td></td>`;
                    tableBody.appendChild(tr);
                }
            }

            document.getElementById('disp-total').textContent = grandTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }

        // 5. تصدير PDF
        function exportPDF() {
            const element = document.getElementById('invoice-paper');
            const btn = document.getElementById('btn-download');

            document.body.classList.add('exporting');
            btn.innerHTML = 'جاري التحميل...';
            btn.disabled = true;

            const opt = {
                margin:       0,
                filename:     document.getElementById('in-invoice-num').value + '.pdf',
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { scale: 2, useCORS: true, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                document.body.classList.remove('exporting');
                btn.innerHTML = 'تحميل الفاتورة PDF';
                btn.disabled = false;
            }).catch(err => {
                console.error('PDF Error:', err);
                alert('حدث خطأ أثناء التحميل.');
                document.body.classList.remove('exporting');
                btn.innerHTML = 'تحميل الفاتورة PDF';
                btn.disabled = false;
            });
        }

        // 6. تكييف الشاشة
        function scalePreview() {
            const container = document.querySelector('.preview-container');
            const paper = document.getElementById('invoice-paper');
            const containerWidth = container.clientWidth - 32; 
            
            if (window.innerWidth < 1024) {
                const scale = containerWidth / 794; // 210mm
                paper.style.transform = `scale(${scale})`;
                container.style.height = (paper.offsetHeight * scale) + 'px';
            } else {
                paper.style.transform = 'scale(1)';
                container.style.height = 'auto';
            }
        }

        window.addEventListener('resize', scalePreview);
        window.addEventListener('load', () => setTimeout(scalePreview, 100));
    </script>
</body>
</html>
