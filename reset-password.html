<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF7A00">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>إعادة تعيين كلمة المرور | BranZar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{font-family:'Cairo',sans-serif;margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(165deg,#FFF8F1 0%,#FFFFFF 45%,#FFF1E0 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;direction:rtl;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.card{background:rgba(255,255,255,.98);backdrop-filter:blur(20px);border:1.5px solid #FFE0BD;border-radius:2rem;padding:2.5rem 2rem;max-width:460px;width:100%;box-shadow:0 30px 70px -25px rgba(255,122,0,.4),0 10px 30px rgba(0,0,0,.05);animation:in .6s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:-120px;right:-100px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,122,0,.18),transparent 70%);pointer-events:none}
@keyframes in{from{transform:translateY(40px) scale(.92);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.logo{width:88px;height:88px;border-radius:50%;background:#fff;padding:6px;box-shadow:0 14px 40px -10px rgba(255,122,0,.65),0 0 0 6px rgba(255,122,0,.08);margin:0 auto 1.5rem;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.logo img{width:100%;height:100%;object-fit:contain;border-radius:50%}
.icon{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:#fff;margin:0 auto 1.5rem;position:relative;z-index:1;box-shadow:0 14px 40px -10px rgba(0,0,0,.25)}
.icon.orange{background:linear-gradient(135deg,#FF7A00,#FFA64D)}
.icon.green{background:linear-gradient(135deg,#10B981,#059669)}
.icon.red{background:linear-gradient(135deg,#EF4444,#DC2626)}
h1{font-size:1.5rem;font-weight:900;text-align:center;margin-bottom:.5rem;position:relative;z-index:1;letter-spacing:-.3px}
.sub{text-align:center;color:#6B7280;font-size:.88rem;margin-bottom:1.75rem;line-height:1.7;position:relative;z-index:1}
.field{position:relative;margin-bottom:1rem}
.field-icon{position:absolute;right:1.15rem;top:50%;transform:translateY(-50%);color:#FF7A00;font-size:1rem;pointer-events:none}
input{width:100%;padding:1rem 3.1rem 1rem 1rem;border:2px solid #E5E7EB;border-radius:1.1rem;font-size:.95rem;background:#FAFAFA;transition:all .25s;color:#1A1A1A;font-weight:600;font-family:'Cairo',sans-serif;box-sizing:border-box}
input:focus{outline:none;border-color:#FF7A00;background:#FFF;box-shadow:0 0 0 5px rgba(255,122,0,.1)}
input.has-toggle{padding-left:3.1rem}
.toggle{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#9CA3AF;font-size:.95rem}
.toggle:hover{background:#FFF7ED;color:#FF7A00}
button[type="submit"]{width:100%;padding:1.05rem;background:linear-gradient(135deg,#FF7A00 0%,#FFA64D 100%);color:#fff;border:none;border-radius:1.1rem;font-weight:800;font-size:1.05rem;cursor:pointer;transition:all .25s;box-shadow:0 14px 32px -10px rgba(255,122,0,.75);display:flex;align-items:center;justify-content:center;gap:10px;margin-top:1.5rem;font-family:'Cairo',sans-serif;position:relative;z-index:1}
button[type="submit"]:hover:not(:disabled){transform:translateY(-2px)}
button[type="submit"]:disabled{opacity:.7;cursor:not-allowed}
.msg{padding:.9rem 1rem;border-radius:.9rem;font-size:.87rem;font-weight:700;text-align:center;margin-top:1rem;display:none;line-height:1.6;position:relative;z-index:1}
.msg.show{display:block}
.msg.error{background:#FEF2F2;border:1.5px solid #FECACA;color:#DC2626}
.msg.success{background:#ECFDF5;border:1.5px solid #A7F3D0;color:#059669}
.msg.info{background:#EFF6FF;border:1.5px solid #BFDBFE;color:#1E40AF}
.hint{font-size:.75rem;color:#6B7280;margin-top:.4rem;font-weight:600;padding-right:4px}
.hint.warn{color:#F59E0B}
.hint.ok{color:#10B981}
.strength{display:none;margin-top:.6rem}
.strength.show{display:block}
.bars{display:flex;gap:4px;margin-bottom:6px}
.bar{flex:1;height:5px;background:#E2E8F0;border-radius:3px;transition:background .3s}
.strength-text{font-size:.74rem;font-weight:800;color:#6B7280}
.footer{text-align:center;margin-top:1.5rem;padding-top:1.25rem;border-top:1px dashed #FFE0BD;color:#9ca3af;font-size:.82rem;position:relative;z-index:1}
.footer a{color:#FF7A00;text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.footer a:hover{text-decoration:underline}
.hidden{display:none!important}
.spinner{width:44px;height:44px;margin:2rem auto;border:3px solid rgba(255,122,0,.15);border-top-color:#FF7A00;border-radius:50%;animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="card">

  <!-- Loading -->
  <div id="loadingView">
    <div class="logo"><img src="file_00000000b5e881f6a653c6d272e68de7.png" alt="BranZar" onerror="this.parentElement.innerHTML='<i class=\'fas fa-store\' style=\'color:#FF7A00;font-size:2rem;\'></i>'"></div>
    <h1>جارٍ التحقق</h1>
    <p class="sub">نراقب صلاحية الرابط...</p>
    <div class="spinner"></div>
  </div>

  <!-- Reset password form -->
  <div id="resetView" class="hidden">
    <div class="icon orange"><i class="fas fa-lock"></i></div>
    <h1>تعيين كلمة مرور جديدة</h1>
    <p class="sub" id="resetSub">أدخل كلمة المرور الجديدة لحسابك</p>

    <form id="resetForm" autocomplete="off" novalidate>
      <div class="field">
        <input type="password" id="pwd1" placeholder="كلمة المرور الجديدة" required autocomplete="new-password" minlength="8" maxlength="128">
        <i class="fas fa-lock field-icon"></i>
        <button type="button" class="toggle" data-toggle="pwd1"><i class="fas fa-eye"></i></button>
      </div>
      <div class="field">
        <input type="password" id="pwd2" placeholder="تأكيد كلمة المرور" required autocomplete="new-password" minlength="8" maxlength="128">
        <i class="fas fa-shield-halved field-icon"></i>
        <button type="button" class="toggle" data-toggle="pwd2"><i class="fas fa-eye"></i></button>
      </div>

      <div class="strength" id="strength">
        <div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        <div class="strength-text" id="strengthText">قوة كلمة المرور</div>
      </div>

      <div class="hint" id="matchHint"></div>

      <div class="msg error" id="resetError"></div>

      <button type="submit" id="resetBtn">
        <i class="fas fa-check-circle"></i>
        <span>تعيين كلمة المرور</span>
      </button>
    </form>
  </div>

  <!-- Success -->
  <div id="successView" class="hidden">
    <div class="icon green"><i class="fas fa-check-circle"></i></div>
    <h1 id="successTitle">تم بنجاح! 🎉</h1>
    <p class="sub" id="successSub">جارٍ توجيهك إلى صفحة الدخول...</p>
    <div class="spinner"></div>
  </div>

  <!-- Error -->
  <div id="errorView" class="hidden">
    <div class="icon red"><i class="fas fa-exclamation-triangle"></i></div>
    <h1 id="errorTitle">رابط غير صالح</h1>
    <p class="sub" id="errorSub">الرابط الذي فتحته منتهي الصلاحية أو تم استخدامه مسبقًا.</p>
    <a href="a.html" style="display:block;width:100%;padding:1.05rem;background:linear-gradient(135deg,#FF7A00,#FFA64D);color:#fff;text-decoration:none;border-radius:1.1rem;font-weight:800;text-align:center;box-shadow:0 14px 32px -10px rgba(255,122,0,.75);margin-top:1.5rem">
      <i class="fas fa-sign-in-alt"></i> العودة لتسجيل الدخول
    </a>
  </div>

  <div class="footer">
    <a href="index.html"><i class="fas fa-arrow-right"></i> الصفحة الرئيسية</a>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script>
'use strict';

const firebaseConfig = {
  apiKey: "AIzaSyDUfiHqBPQuFKrsHxoSDdR0j7DMvekfYiA",
  authDomain: "bazarena-725e4.firebaseapp.com",
  projectId: "bazarena-725e4",
  storageBucket: "bazarena-725e4.firebasestorage.app",
  messagingSenderId: "977750898059",
  appId: "1:977750898059:web:247e8513b48490ed622b8e"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

const $ = id => document.getElementById(id);
const show = id => { ['loadingView','resetView','successView','errorView'].forEach(v => $(v).classList.toggle('hidden', v !== id)); };

function showError(title, msg) {
  $('errorTitle').textContent = title;
  $('errorSub').textContent = msg;
  show('errorView');
}

function mapActionError(code) {
  const m = {
    'auth/expired-action-code': 'انتهت صلاحية الرابط — اطلب رابطاً جديداً',
    'auth/invalid-action-code': 'الرابط غير صالح أو تم استخدامه مسبقاً',
    'auth/user-disabled': 'هذا الحساب معطّل',
    'auth/user-not-found': 'لا يوجد حساب بهذا البريد',
    'auth/weak-password': 'كلمة المرور ضعيفة (8 أحرف على الأقل)',
    'auth/network-request-failed': 'تعذر الاتصال بالشبكة',
    'auth/too-many-requests': 'محاولات كثيرة — حاول لاحقاً'
  };
  return m[code] || 'حدث خطأ غير متوقع';
}

// Read URL parameters
const params = new URLSearchParams(location.search);
const mode = params.get('mode');
const oobCode = params.get('oobCode');
const continueUrl = params.get('continueUrl');

// Force HTTPS
if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
  location.replace('https://' + location.host + location.pathname + location.search);
}

// Prevent referrer leaks of oobCode
try { history.replaceState(null, '', location.pathname); } catch (e) {}

async function init() {
  if (!mode || !oobCode) {
    showError('رابط غير صالح', 'لم يتم العثور على بيانات إعادة التعيين في الرابط.');
    return;
  }

  // Validate oobCode format (basic)
  if (!/^[A-Za-z0-9_-]{20,200}$/.test(oobCode)) {
    showError('رابط غير صالح', 'الرابط لا يحتوي على رمز صحيح.');
    return;
  }

  if (mode === 'resetPassword') {
    try {
      const email = await auth.verifyPasswordResetCode(oobCode);
      $('resetSub').innerHTML = 'أدخل كلمة مرور جديدة لحساب:<br><strong style="color:#FF7A00;direction:ltr;display:inline-block">' + email.replace(/</g,'&lt;') + '</strong>';
      show('resetView');
      setTimeout(() => $('pwd1').focus(), 300);
    } catch (err) {
      console.error(err);
      showError('رابط غير صالح', mapActionError(err.code));
    }
  } else if (mode === 'verifyEmail') {
    try {
      await auth.applyActionCode(oobCode);
      $('successTitle').textContent = 'تم تأكيد بريدك! ✅';
      $('successSub').innerHTML = 'بريدك مؤكد الآن — جارٍ توجيهك لتسجيل الدخول...';
      show('successView');
      setTimeout(() => location.href = 'a.html', 2500);
    } catch (err) {
      showError('تعذر تأكيد البريد', mapActionError(err.code));
    }
  } else if (mode === 'recoverEmail') {
    try {
      const info = await auth.checkActionCode(oobCode);
      await auth.applyActionCode(oobCode);
      $('successTitle').textContent = 'تم استعادة بريدك';
      $('successSub').innerHTML = 'تم استعادة بريدك: <strong>' + (info.data.email||'') + '</strong>';
      show('successView');
      setTimeout(() => location.href = 'a.html', 3000);
    } catch (err) {
      showError('تعذر استعادة البريد', mapActionError(err.code));
    }
  } else {
    showError('وضع غير معروف', 'نوع العملية غير مدعوم.');
  }
}

// Password strength & match check
const pwd1 = $('pwd1'), pwd2 = $('pwd2'), strength = $('strength'), strengthText = $('strengthText'), matchHint = $('matchHint');

pwd1.addEventListener('input', () => {
  const p = pwd1.value;
  if (!p) { strength.classList.remove('show'); return; }
  strength.classList.add('show');

  let score = 0;
  if (p.length >= 8) score++;
  if (p.length >= 12) score++;
  if (/[A-Z]/.test(p) && /[a-z]/.test(p)) score++;
  if (/\d/.test(p)) score++;
  if (/[^A-Za-z0-9]/.test(p)) score++;

  const colors = ['#EF4444','#F59E0B','#F59E0B','#10B981','#059669'];
  const labels = ['ضعيفة جداً','ضعيفة','متوسطة','قوية','قوية جداً'];
  document.querySelectorAll('.bar').forEach((b, i) => {
    b.style.background = i < score ? colors[Math.min(score-1, 4)] : '#E2E8F0';
  });
  strengthText.textContent = labels[Math.min(score, 4)] || '';
  strengthText.style.color = colors[Math.min(score, 4)] || '';

  checkMatch();
});

pwd2.addEventListener('input', checkMatch);

function checkMatch() {
  if (!pwd2.value) { matchHint.textContent = ''; matchHint.className = 'hint'; return; }
  if (pwd1.value === pwd2.value) {
    matchHint.textContent = '✓ كلمتا المرور متطابقتان';
    matchHint.className = 'hint ok';
  } else {
    matchHint.textContent = '✗ كلمتا المرور غير متطابقتين';
    matchHint.className = 'hint warn';
  }
}

// Toggle password visibility
document.querySelectorAll('.toggle[data-toggle]').forEach(btn => {
  btn.addEventListener('click', () => {
    const inp = $(btn.getAttribute('data-toggle'));
    const ic = btn.querySelector('i');
    const isPwd = inp.type === 'password';
    inp.type = isPwd ? 'text' : 'password';
    ic.className = isPwd ? 'fas fa-eye-slash' : 'fas fa-eye';
  });
});

// Form submit
$('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('resetError');
  err.classList.remove('show');

  const p1 = pwd1.value, p2 = pwd2.value;

  if (p1.length < 8) { err.textContent = '⚠️ كلمة المرور يجب أن تكون 8 أحرف على الأقل'; err.classList.add('show'); return; }
  if (p1.length > 128) { err.textContent = '⚠️ كلمة المرور طويلة جداً'; err.classList.add('show'); return; }
  if (p1 !== p2) { err.textContent = '⚠️ كلمتا المرور غير متطابقتين'; err.classList.add('show'); return; }
  if (p1 === oobCode || p1 === email) { err.textContent = '⚠️ كلمة مرور غير آمنة'; err.classList.add('show'); return; }

  const btn = $('resetBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>جارٍ الحفظ...</span>';

  try {
    await auth.confirmPasswordReset(oobCode, p1);
    // Clear sensitive data
    pwd1.value = ''; pwd2.value = '';
    $('successTitle').textContent = 'تم تغيير كلمة المرور! 🎉';
    $('successSub').innerHTML = 'يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.';
    show('successView');
    setTimeout(() => location.href = 'a.html', 2500);
  } catch (err2) {
    console.error(err2);
    err.textContent = '❌ ' + mapActionError(err2.code);
    err.classList.add('show');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check-circle"></i> <span>تعيين كلمة المرور</span>';
  }
});

// Disable form auto-submit on Enter in confirm field — wait for explicit submit
$('resetForm').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') e.preventDefault();
});

// Block paste in confirm field for security (optional — remove if annoying)
pwd2.addEventListener('paste', (e) => {
  // Allowed but logged
  console.log('[Security] paste in password-confirm');
});

// Prevent form submission if oobCode is missing
init();
</script>
</body>
</html>
